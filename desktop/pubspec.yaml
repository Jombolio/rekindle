name: rekindle
description: Self-hosted comic, manga, and book reader.
version: 1.6.1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Persistence — prefs & local SQLite
  shared_preferences: ^2.3.4
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4     # Linux / Windows desktop

  # File system
  path_provider: ^2.1.4
  path: ^1.9.0

  # Image loading & reader
  cached_network_image: ^3.4.1

  # Offline: ZIP/CBZ extraction on-device
  archive: ^3.6.1
  # SHA-256 of downloaded updates, checked against the release's .sha256.
  crypto: ^3.0.7

  # Connectivity detection
  connectivity_plus: ^6.1.1

  # File picker (admin upload)
  file_picker: ^8.1.7

  # EPUB: XML parsing + HTML rendering (no WebView required)
  xml: ^6.5.0
  flutter_widget_from_html_core: ^0.15.0
  # CSS declarations the HTML widget hands to its factory (paragraph indents).
  csslib: ^1.0.2
  # Release notes are Markdown; rendered as HTML by the widget above.
  markdown: ^7.3.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

  # Discord Rich Presence — Windows named-pipe access via kernel32
  ffi: ^2.1.0
  # Read-aloud. sherpa-onnx is pinned to the last 1.x: 2.x dropped the built-in
  # phonemiser, and then skips any word its lexicon lacks.
  sherpa_onnx: 1.13.8
  flutter_soloud: 4.1.7
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/wordnet.db.gz
    - assets/dictionary/LICENSE-WordNet.txt
    # Licences of the bundled reading fonts, which must ship with them.
    - assets/fonts/OFL-OpenDyslexic.txt
    - assets/fonts/OFL-AtkinsonHyperlegible.txt
    - assets/fonts/OFL-Lexend.txt
  # Reading fonts for books, all under the SIL Open Font License 1.1.
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
        - asset: assets/fonts/OpenDyslexic-Italic.otf
          style: italic
        - asset: assets/fonts/OpenDyslexic-BoldItalic.otf
          weight: 700
          style: italic
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
