name: Build

# Gitea counterpart of .github/workflows/build.yml, on the self-hosted Linux
# runner (label `ubuntu-latest`, image catthehacker/ubuntu:act-latest). The
# Windows jobs live in windows.yml because they need the Windows runner.
#
# Differences from GitHub, all forced by Gitea:
#  - upload-artifact is v3: v4 refuses to run on Gitea ("not supported on GHES").
#  - Pull requests get no repository secrets, so the signed Android APK and
#    the licensed server Release build fall back to unsigned/Debug builds,
#    and those fallbacks are not uploaded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Client — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in step with .github/workflows/build.yml.
          flutter-version: 3.47.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          # GitHub's hosted runners preinstall Flutter's Linux toolchain;
          # the act runner image doesn't. Package list from Flutter's
          # Linux setup docs.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Before the build, so a failing test fails fast rather than after the
      # compile. Same order as the GitHub job.
      - name: Test
        working-directory: desktop
        run: flutter test

      - name: Analyze
        working-directory: desktop
        run: flutter analyze

      - name: Build
        working-directory: desktop
        run: flutter build linux --release --obfuscate --split-debug-info=symbols/

      # make-appimage.sh runs appimagetool in extract-and-run mode, so it
      # needs no FUSE inside the job container.
      - name: Package AppImage
        run: |
          bash desktop/linux/packaging/make-appimage.sh \
            desktop/build/linux/x64/release/bundle \
            RekindleClient-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v3
        with:
          name: Rekindle-linux-x64
          path: desktop/build/linux/x64/release/bundle/

      - uses: actions/upload-artifact@v3
        with:
          name: Rekindle-linux-x86_64-AppImage
          path: RekindleClient-linux-x86_64.AppImage

  build-flatpak:
    name: Client — Flatpak
    runs-on: ubuntu-latest
    # Same image as GitHub: it carries flatpak, flatpak-builder and the GNOME
    # SDK. Keep the tag in step with runtime-version in the manifest.
    # flatpak-builder sandboxes with bubblewrap, which needs a privileged
    # container: the runner's config must set `container.privileged: true`.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Builds from the released client zip named in the manifest, so this
      # verifies the manifest itself rather than a local build. Pinned to the
      # same commit as GitHub.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: Rekindle.flatpak
          manifest-path: desktop/linux/packaging/flatpak/io.github.Jombolio.Rekindle.yml
          # The action's own upload and cache use the v4 artifact/cache
          # toolkit, which Gitea rejects; upload with v3 below instead.
          upload-artifact: false
          cache: false
          restore-cache: false

      - uses: actions/upload-artifact@v3
        with:
          name: Rekindle-flatpak
          path: Rekindle.flatpak

  build-android:
    name: Client — Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      # Provisions cmdline-tools (sdkmanager on PATH) and accepts licenses.
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which Google
          # removed from the SDK repository — sdkmanager then fails the job.
          packages: platform-tools

      # Native CBR/RAR decoder (libarchive) needs the pinned NDK + CMake.
      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/rekindle.jks
          cat <<EOF > android/keystore.properties
          storeFile=rekindle.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease

      # Without the keystore (pull requests), a release build has no signing
      # config and fails, so prove the app builds with a debug APK instead.
      - name: Build debug APK (no keystore)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: |
          echo "::notice::No keystore available; building an unsigned debug APK."
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v3
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: Rekindle-android
          path: android/app/build/outputs/apk/release/app-release.apk

  test-server:
    name: Server — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        working-directory: server
        run: dotnet test

  build-server-linux:
    name: Server — Linux
    runs-on: ubuntu-latest
    env:
      # ImageSharp 3.2+ refuses Release builds without a Six Labors license.
      # Repository secret; MSBuild reads environment variables as properties.
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish
        working-directory: server
        run: |
          if [ -n "$SixLaborsLicenseKey" ]; then
            dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=linux-x64
          else
            # Pull requests get no secrets; ImageSharp only warns in Debug.
            echo "::notice::No Six Labors license available; publishing a Debug build to prove it builds."
            dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=linux-x64 /p:Configuration=Debug
          fi

      - uses: actions/upload-artifact@v3
        if: env.SixLaborsLicenseKey != ''
        with:
          name: RekindleServer-linux-x64
          path: server/Rekindle.Server/bin/publish/linux-x64/
