name: CI

# Gitea Actions. Once a .gitea/workflows directory exists, Gitea runs only
# these and ignores .github/workflows, so the GitHub release/build pipelines
# (Windows, Flatpak, signed Android) are deliberately not duplicated here.
# This is the fast test-and-lint gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop — test & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in step with .github/workflows/build.yml.
          flutter-version: 3.47.3

      - name: Test
        working-directory: desktop
        run: flutter test

      - name: Analyze
        working-directory: desktop
        run: flutter analyze

  server:
    name: Server — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        working-directory: server
        run: dotnet test
