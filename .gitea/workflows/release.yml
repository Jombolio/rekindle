name: Release

# Gitea counterpart of .github/workflows/release.yml: when a release is
# published on Gitea, build every client and server artifact and attach it to
# that release. GitHub's `gh release upload --clobber` has no Gitea equivalent,
# so .gitea/scripts/upload-release-asset.{sh,ps1} call the release API instead.
#
# The tagged commit must contain those scripts (anything released from main
# after they were added does).

on:
  release:
    types: [published]

env:
  # Read by the upload scripts. The automatic token can write this
  # repository's releases.
  GITEA_TOKEN: ${{ github.token }}
  GITEA_SERVER_URL: ${{ github.server_url }}
  GITEA_REPOSITORY: ${{ github.repository }}
  RELEASE_ID: ${{ github.event.release.id }}

jobs:
  release-linux:
    name: Client — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in step with .github/workflows/release.yml.
          flutter-version: 3.47.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          # GitHub's hosted runners preinstall Flutter's Linux toolchain;
          # the act runner image doesn't. Package list from Flutter's
          # Linux setup docs.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zip jq

      - name: Build
        working-directory: desktop
        run: flutter build linux --release --obfuscate --split-debug-info=symbols/

      - name: Package AppImage
        run: |
          bash desktop/linux/packaging/make-appimage.sh \
            desktop/build/linux/x64/release/bundle \
            RekindleClient-linux-x86_64.AppImage

      - name: Package portable zip
        run: |
          cd desktop/build/linux/x64/release/bundle
          zip -r ../../../../../../RekindleClient-linux-x64.zip .

      - name: Upload to release
        run: |
          bash .gitea/scripts/upload-release-asset.sh \
            RekindleClient-linux-x86_64.AppImage \
            RekindleClient-linux-x64.zip

  release-windows:
    name: Client — Windows
    # The self-hosted Windows runner (host mode, preinstalled toolchain); see
    # windows.yml.
    runs-on: windows
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Check Flutter version
        run: |
          $expected = '3.47.3'
          $version = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          Write-Host "Flutter $version"
          if ($version -ne $expected) { throw "Expected Flutter $expected, found $version" }

      - name: Build
        working-directory: desktop
        run: flutter build windows --release --obfuscate --split-debug-info=symbols/; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'

      - name: Package portable zip
        run: Compress-Archive -Path desktop/build/windows/x64/runner/Release/* -DestinationPath RekindleClient-windows-x64.zip -Force

      - name: Upload to release
        run: |
          & .gitea\scripts\upload-release-asset.ps1 `
            desktop\windows\output\Rekindle-windows-x64Setup.exe `
            RekindleClient-windows-x64.zip

  release-android:
    name: Client — Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which Google
          # removed from the SDK repository — sdkmanager then fails the job.
          packages: platform-tools

      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install upload tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      # A release must be signed: fail clearly rather than ship nothing.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; add the keystore secrets under Settings → Actions → Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/rekindle.jks
          cat <<EOF > android/keystore.properties
          storeFile=rekindle.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RekindleAndroid.apk

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleAndroid.apk

  release-server-linux:
    name: Server — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=linux-x64
        env:
          # ImageSharp 3.2+ refuses Release builds without a Six Labors license.
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Package
        run: |
          cd server/Rekindle.Server/bin/publish/linux-x64
          zip -r ../../../../../RekindleServer-linux-x64.zip .

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleServer-linux-x64.zip

  release-server-windows:
    name: Server — Windows
    # Cross-published from Linux, as on GitHub; windows.yml boot-tests it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=win-x64
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Package
        run: |
          cd server/Rekindle.Server/bin/publish/win-x64
          zip -r ../../../../../RekindleServer-windows-x64.zip .

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleServer-windows-x64.zip
