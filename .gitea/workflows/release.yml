name: Release

# Publishes a Gitea release and attaches every client and server artifact.
#
# To release, bump the version, add release-notes/<tag>.md (optional; without
# it the notes are the commits since the previous tag), then push the tag:
#
#   git tag -a v1.5.0 -m "Rekindle v1.5.0" && git push gitea v1.5.0
#
# A tag with a suffix (v1.5.0-beta.1) becomes a pre-release. "Run workflow"
# with a tag publishes one that already exists, e.g. a tag pushed before this
# workflow could see it. Re-running reuses the release and replaces its files.
#
# The build jobs check out the tag, so the tagged commit must contain
# .gitea/scripts/upload-release-asset.* and write-android-keystore.sh
# (anything tagged from main after November 2026 does).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, e.g. v1.5.0-beta.1
        required: true

env:
  # Read by the release scripts. The automatic token can write this
  # repository's releases.
  GITEA_TOKEN: ${{ github.token }}
  GITEA_SERVER_URL: ${{ github.server_url }}
  GITEA_REPOSITORY: ${{ github.repository }}

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # The workflow's own commit: it has the scripts and the notes, even when
      # publishing an older tag through "Run workflow".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Create or reuse the release
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force --tags origin
          bash .gitea/scripts/create-release.sh

  release-linux:
    name: Client — Linux
    needs: publish
    env:
      RELEASE_ID: ${{ needs.publish.outputs.release_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in step with .github/workflows/release.yml.
          flutter-version: 3.47.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          # GitHub's hosted runners preinstall Flutter's Linux toolchain;
          # the act runner image doesn't. Package list from Flutter's
          # Linux setup docs.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zip jq

      - name: Build
        working-directory: desktop
        run: flutter build linux --release --obfuscate --split-debug-info=symbols/

      - name: Package AppImage
        run: |
          bash desktop/linux/packaging/make-appimage.sh \
            desktop/build/linux/x64/release/bundle \
            RekindleClient-linux-x86_64.AppImage

      - name: Package portable zip
        run: |
          cd desktop/build/linux/x64/release/bundle
          zip -r ../../../../../../RekindleClient-linux-x64.zip .

      - name: Upload to release
        run: |
          bash .gitea/scripts/upload-release-asset.sh \
            RekindleClient-linux-x86_64.AppImage \
            RekindleClient-linux-x64.zip

  release-windows:
    name: Client — Windows
    needs: publish
    env:
      RELEASE_ID: ${{ needs.publish.outputs.release_id }}
    # The self-hosted Windows runner (host mode, preinstalled toolchain); see
    # windows.yml.
    runs-on: windows
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: Check Flutter version
        run: |
          $expected = '3.47.3'
          $version = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          Write-Host "Flutter $version"
          if ($version -ne $expected) { throw "Expected Flutter $expected, found $version" }

      - name: Build
        working-directory: desktop
        run: flutter build windows --release --obfuscate --split-debug-info=symbols/; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'

      - name: Package portable zip
        run: Compress-Archive -Path desktop/build/windows/x64/runner/Release/* -DestinationPath RekindleClient-windows-x64.zip -Force

      - name: Upload to release
        run: |
          & .gitea\scripts\upload-release-asset.ps1 `
            desktop\windows\output\Rekindle-windows-x64Setup.exe `
            RekindleClient-windows-x64.zip

  release-android:
    name: Client — Android
    needs: publish
    env:
      RELEASE_ID: ${{ needs.publish.outputs.release_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which Google
          # removed from the SDK repository — sdkmanager then fails the job.
          packages: platform-tools

      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install upload tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      # A release must be signed. The script fails with a specific message
      # if a signing secret is missing or wrong, rather than ship nothing.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .gitea/scripts/write-android-keystore.sh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RekindleAndroid.apk

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleAndroid.apk

  release-server-linux:
    name: Server — Linux
    needs: publish
    env:
      RELEASE_ID: ${{ needs.publish.outputs.release_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=linux-x64
        env:
          # ImageSharp 3.2+ refuses Release builds without a Six Labors license.
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Package
        run: |
          cd server/Rekindle.Server/bin/publish/linux-x64
          zip -r ../../../../../RekindleServer-linux-x64.zip .
          cd ../../../../..
          # The server's --update refuses a download it can't verify.
          sha256sum RekindleServer-linux-x64.zip > RekindleServer-linux-x64.zip.sha256

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleServer-linux-x64.zip RekindleServer-linux-x64.zip.sha256

  release-server-windows:
    name: Server — Windows
    needs: publish
    env:
      RELEASE_ID: ${{ needs.publish.outputs.release_id }}
    # Cross-published from Linux, as on GitHub; windows.yml boot-tests it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=win-x64
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Package
        run: |
          cd server/Rekindle.Server/bin/publish/win-x64
          zip -r ../../../../../RekindleServer-windows-x64.zip .
          cd ../../../../..
          # The server's --update refuses a download it can't verify.
          sha256sum RekindleServer-windows-x64.zip > RekindleServer-windows-x64.zip.sha256

      - name: Upload to release
        run: bash .gitea/scripts/upload-release-asset.sh RekindleServer-windows-x64.zip RekindleServer-windows-x64.zip.sha256
