Categories:
  - Reading
License: GPL-3.0-only
SourceCode: https://github.com/Jombolio/rekindle
IssueTracker: https://github.com/Jombolio/rekindle/issues

AutoName: Rekindle

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0 # Make sure to tag your release on your Git host!
    subdir: android
    gradle:
      - yes

AutoUpdateMode: Version v%v
# Only plain version tags: v1.5.0-beta.1 and other pre-release tags are
# skipped, so the F-Droid repository stays on stable releases.
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
