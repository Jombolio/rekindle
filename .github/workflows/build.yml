name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Client — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI is reproducible and matches local dev. An unpinned
          # channel silently follows whatever stable becomes, which is how a
          # green build turns red without a commit touching it.
          flutter-version: 3.47.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Before the build, so a failing test fails fast rather than after a
      # four-minute compile. Runs here rather than in its own job to reuse this
      # one's Flutter setup and pub cache.
      - name: Test
        working-directory: desktop
        run: flutter test

      - name: Analyze
        working-directory: desktop
        run: flutter analyze

      - name: Build
        working-directory: desktop
        run: flutter build linux --release --obfuscate --split-debug-info=symbols/

      - name: Package AppImage
        run: |
          bash desktop/linux/packaging/make-appimage.sh \
            desktop/build/linux/x64/release/bundle \
            RekindleClient-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Rekindle-linux-x64
          path: desktop/build/linux/x64/release/bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: Rekindle-linux-x86_64-AppImage
          path: RekindleClient-linux-x86_64.AppImage

  build-windows:
    name: Client — Windows
    # Pinned to VS 2022 (v17). `windows-latest` moved to a Visual Studio 18
    # (v180) image that the locked native_toolchain_c (0.17.6, pulled in via
    # sqlite3's native-assets build hook) can't compile against, breaking
    # `flutter build windows`. Revisit when that dep chain supports newer VS.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI is reproducible and matches local dev. An unpinned
          # channel silently follows whatever stable becomes, which is how a
          # green build turns red without a commit touching it.
          flutter-version: 3.47.3

      - name: Build
        working-directory: desktop
        run: flutter build windows --release --obfuscate --split-debug-info=symbols/

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\windows\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Rekindle-windows-x64Setup
          path: desktop/windows/output/Rekindle-windows-x64Setup.exe

  build-flatpak:
    name: Client — Flatpak
    runs-on: ubuntu-latest
    # The action needs flatpak, flatpak-builder and the GNOME SDK already
    # present; this image carries them. Keep the tag in step with
    # runtime-version in the manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Builds from the released client zip named in the manifest, so this
      # verifies the manifest itself rather than a local build.
      # The action publishes no tags or releases, so it is pinned to a commit
      # rather than tracking master — same reasoning as the Flutter and
      # appimagetool pins.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          # The action appends the architecture itself, so naming this
          # Rekindle-x86_64 would produce Rekindle-x86_64-x86_64.flatpak.
          bundle: Rekindle.flatpak
          manifest-path: desktop/linux/packaging/flatpak/io.github.Jombolio.Rekindle.yml
          cache-key: flatpak-builder-${{ github.sha }}

  build-android:
    name: Client — Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      # Provisions Android cmdline-tools (puts sdkmanager on PATH) and accepts licenses;
      # the hosted runner doesn't expose sdkmanager on PATH by default.
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which Google
          # removed from the SDK repository — sdkmanager then fails the job.
          packages: platform-tools

      # Native CBR/RAR decoder (libarchive) needs the pinned NDK + CMake; AGP won't
      # auto-install the NDK, so provision both explicitly.
      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/rekindle.jks
          cat <<EOF > android/keystore.properties
          storeFile=rekindle.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Rekindle-android
          path: android/app/build/outputs/apk/release/app-release.apk

  test-server:
    name: Server — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Runs unit + integration tests. The publish jobs don't build the test
      # project, so without this step the suite is never compiled or executed.
      - name: Test
        working-directory: server
        run: dotnet test

  build-server-linux:
    name: Server — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: RekindleServer-linux-x64
          path: server/Rekindle.Server/bin/publish/linux-x64/

  build-server-windows:
    name: Server — Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish
        working-directory: server
        run: dotnet publish Rekindle.Server/Rekindle.Server.csproj /p:PublishProfile=win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: RekindleServer-windows-x64
          path: server/Rekindle.Server/bin/publish/win-x64/
