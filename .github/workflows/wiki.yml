name: Wiki

# The GitHub Wiki is a separate git repository (<repo>.wiki.git) that shares no
# history with this one, so it drifts silently unless something publishes to it.
# It had: the wiki told people to `cd client` for months after that directory was
# renamed to `desktop`, and nobody could have noticed without diffing by hand.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish wiki/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki/ to the wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo

          # Copy rather than mirror: a page written in the web editor that has no
          # counterpart here should not disappear the next time a doc changes.
          # Removing a page is therefore still a manual step, which is the safer
          # default for a surface anyone with write access can edit directly.
          cp wiki/*.md wiki-repo/

          cd wiki-repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already matches wiki/ — nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "docs: publish from ${GITHUB_SHA:0:7}"
          git push
